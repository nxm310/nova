name: Build Nova Windows Executable (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build static web app (out folder)
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pydirectinput

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console `
            --uac-admin `
            --name "Nova-StarCitizen" `
            --add-data "out;out" `
            scripts/bridge.py

      - name: Add 1-click batch launcher into release folder
        run: |
          Copy-Item "DEMARRER_NOVA.bat" "dist\Nova-StarCitizen\" -ErrorAction SilentlyContinue

      - name: Compress Release Archive (ZIP)
        run: |
          Compress-Archive -Path dist\Nova-StarCitizen\* -DestinationPath Nova-StarCitizen-Windows.zip -Force

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Nova Star Citizen v1.0.0 (Exécutable Windows)"
          body: |
            # 🚀 Nova — Compagnon Star Citizen (Exécutable Windows Tout-en-un)

            ### Pour lancer le compagnon :
            1. Téléchargez le fichier **`Nova-StarCitizen-Windows.zip`** ci-dessous.
            2. Dézippez-le dans un dossier sur votre PC de jeu.
            3. Double-cliquez sur **`Nova-StarCitizen.exe`** !
            
            ### ✨ Ce qui est inclus :
            * **Zéro installation** : pas besoin de Node.js, d'outils compliqués ou de terminal.
            * **Ouverture automatique** de votre navigateur web sur l'application.
            * **Contrôle vocal direct** avec frappe de touches DirectInput dans Star Citizen (`U` pour démarrer le vaisseau, `N` pour le train, `B` pour le quantum, `L` pour les phares...).
            * **Vision d'écran IA Gemini** (analyse de votre cockpit ou environnement en jeu).
          files: Nova-StarCitizen-Windows.zip
