name: Build Nova Windows Executable (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build static web app (out folder)
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pydirectinput

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console `
            --uac-admin `
            --name "Nova-StarCitizen" `
            --add-data "out;out" `
            scripts/bridge.py

      - name: Add 1-click batch launcher into release folder
        run: |
          Copy-Item "DEMARRER_NOVA.bat" "dist\Nova-StarCitizen\" -ErrorAction SilentlyContinue

      - name: Compress Release Archive (ZIP)
        run: |
          Compress-Archive -Path dist\Nova-StarCitizen\* -DestinationPath Nova-StarCitizen-Windows.zip -Force

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.1"
          name: "Nova Star Citizen v1.0.1 (Exécutable Windows)"
          body: |
            # 🚀 Nova v1.0.1 — Compagnon Star Citizen (Exécutable Windows Tout-en-un)

            ### ✨ Nouveautés de la version 1.0.1 :
            * **🔄 Bouton Mise à Jour 1-Clic** : Plus besoin de tout réinstaller manuellement ! Cliquez simplement sur "Mise à jour" dans le menu pour appliquer les nouveaux correctifs.
            * **💾 Sauvegarde automatique et persistante** : Toutes vos touches et configurations sont stockées en permanence dans `%APPDATA%\Nova\nova_config.json` et ne sont jamais écrasées par les mises à jour.
            * **🎙️ Conversation vocale continue fluide** : Correction du blocage du pont après 1 phrase. Le serveur bridge est désormais multi-thread avec un watchdog audio automatique.
            * **⚡ Déclenchement automatique des commandes du cockpit** : Gemini active directement les touches du jeu en réponse naturelle (`[ACTION:KEY:<key>]`).
            * **🚀 Enrichissement des ordres vocaux** : Reconnaissance naturelle de toutes les variantes ("allume les phares", "allumer les phares", "éteins les feux", "rentrer le train d'atterrissage", etc.).

            ### Pour lancer le compagnon :
            1. Téléchargez le fichier **`Nova-StarCitizen-Windows.zip`** ci-dessous.
            2. Dézippez-le dans un dossier sur votre PC de jeu.
            3. Double-cliquez sur **`Nova-StarCitizen.exe`** !
          files: Nova-StarCitizen-Windows.zip
