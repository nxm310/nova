name: Build Nova Windows Executable (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build static web app (out folder)
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pydirectinput

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console `
            --uac-admin `
            --name "Nova-StarCitizen" `
            --add-data "out;out" `
            scripts/bridge.py

      - name: Add 1-click batch launcher into release folder
        run: |
          Copy-Item "DEMARRER_NOVA.bat" "dist\Nova-StarCitizen\" -ErrorAction SilentlyContinue

      - name: Compress Release Archive (ZIP)
        run: |
          Compress-Archive -Path dist\Nova-StarCitizen\* -DestinationPath Nova-StarCitizen-Windows.zip -Force

      - name: Extract version from package.json
        id: pkg_info
        shell: pwsh
        run: |
          $json = Get-Content package.json | ConvertFrom-Json
          $ver = $json.version
          echo "PACKAGE_VERSION=$ver" >> $env:GITHUB_ENV
          echo "TAG_NAME=v$ver" >> $env:GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Nova Star Citizen ${{ env.TAG_NAME }} (Exécutable Windows)"
          body: |
            # 🚀 Nova ${{ env.TAG_NAME }} — Compagnon Star Citizen

            ### 📌 Informations du Déploiement :
            * **Version :** `${{ env.TAG_NAME }}`
            * **Commit :** `${{ github.sha }}`
            * **Détail des modifications :**
            ```
            ${{ github.event.head_commit.message }}
            ```

            ### 📥 Installation & Utilisation :
            1. Téléchargez **`Nova-StarCitizen-Windows.zip`** ci-dessous.
            2. Décompressez l'archive sur votre PC Star Citizen.
            3. Double-cliquez sur **`DEMARRER_NOVA.bat`** !
            4. Vos réglages sont automatiquement conservés dans `%APPDATA%\Nova\nova_config.json`.
          files: Nova-StarCitizen-Windows.zip
